<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="70" y1="27" x2="272" y2="27" stroke="#00E5FF" stroke-width="12" stroke-opacity="0.16" stroke-linecap="round" />
  <line x1="70" y1="27" x2="272" y2="27" stroke="url(#cyanBeamGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="275" cy="27" r="7" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="275" cy="27" r="4.2" fill="#00E5FF" />
  <circle cx="275" cy="27" r="1.8" fill="#FFFFFF" />

  <!-- Badge Icon -->
  <g transform="translate(292, 13)">
    <circle cx="14" cy="14" r="13" fill="#070C16" stroke="#00E5FF" stroke-width="2"/>

    <!-- Code Brackets Icon -->
    <path d="M11 9 L7 14 L11 19" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M17 9 L21 14 L17 19" fill="none" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="16" y1="8" x2="12" y2="20" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="450" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="4.5" fill="url(#headerGrad)">TECH STACK</text>

  <!-- Right Cyber Beam -->
  <circle cx="577" cy="27" r="7" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="577" cy="27" r="4.2" fill="#EC4899" />
  <circle cx="577" cy="27" r="1.8" fill="#FFFFFF" />
  <line x1="580" y1="27" x2="830" y2="27" stroke="url(#purpleBeamGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="580" y1="27" x2="830" y2="27" stroke="#EC4899" stroke-width="12" stroke-opacity="0.16" stroke-linecap="round" />
</svg>
