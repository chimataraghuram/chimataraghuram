<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="pokeHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE135"/>
      <stop offset="30%" stop-color="#00F5FF"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pokeCyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="pokePurpleBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="60" y1="21" x2="225" y2="21" stroke="#00E5FF" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="60" y1="21" x2="225" y2="21" stroke="url(#pokeCyanBeam)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="227" cy="21" r="5" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="227" cy="21" r="3.2" fill="#00E5FF" />
  <circle cx="227" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Pokéball Icon -->
  <g transform="translate(242, 11)">
    <circle cx="10" cy="10" r="9.5" fill="#070C16" stroke="#FFE135" stroke-width="1.6"/>
    <!-- Top red hemisphere -->
    <path d="M1 10 A9 9 0 0 1 19 10 Z" fill="#EE1515"/>
    <!-- Bottom white hemisphere -->
    <path d="M1 10 A9 9 0 0 0 19 10 Z" fill="#FFFFFF"/>
    <!-- Black dividing line -->
    <line x1="1" y1="10" x2="19" y2="10" stroke="#111111" stroke-width="1.8"/>
    <!-- Outer button ring -->
    <circle cx="10" cy="10" r="3.2" fill="#111111"/>
    <!-- Inner button -->
    <circle cx="10" cy="10" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Title Text -->
  <text x="460" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="url(#pokeHeaderGrad)">POKÉMON CONTRIBUTION BATTLE</text>

  <!-- Right Cyber Beam -->
  <circle cx="673" cy="21" r="5" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="673" cy="21" r="3.2" fill="#EC4899" />
  <circle cx="673" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="675" y1="21" x2="840" y2="21" stroke="url(#pokePurpleBeam)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="675" y1="21" x2="840" y2="21" stroke="#EC4899" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
