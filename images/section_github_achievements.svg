<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="21" x2="266" y2="21" stroke="#00E5FF" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="21" x2="266" y2="21" stroke="url(#cyanBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="268" cy="21" r="5" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="268" cy="21" r="3.2" fill="#00E5FF" />
  <circle cx="268" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Trophy Icon Badge -->
  <g transform="translate(284, 11)">
    <circle cx="10" cy="10" r="9" fill="#070C16" stroke="#00E5FF" stroke-width="1.6"/>
    <!-- Trophy Icon -->
    <path d="M7 6 H13 V10 C13 11.66 11.66 13 10 13 C8.34 13 7 11.66 7 10 Z" fill="none" stroke="#00E5FF" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M5.5 7 H7 V9 H5.5 C4.95 9 4.5 8.55 4.5 8 C4.5 7.45 4.95 7 5.5 7 Z" fill="none" stroke="#00E5FF" stroke-width="1.1"/>
    <path d="M14.5 7 H13 V9 H14.5 C15.05 9 15.5 8.55 15.5 8 C15.5 7.45 15.05 7 14.5 7 Z" fill="none" stroke="#00E5FF" stroke-width="1.1"/>
    <line x1="10" y1="13" x2="10" y2="15" stroke="#00E5FF" stroke-width="1.3"/>
    <line x1="7.5" y1="15" x2="12.5" y2="15" stroke="#00E5FF" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="url(#headerGrad)">GITHUB ACHIEVEMENTS</text>

  <!-- Right Cyber Beam -->
  <circle cx="616" cy="21" r="5" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="616" cy="21" r="3.2" fill="#EC4899" />
  <circle cx="616" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="618" y1="21" x2="820" y2="21" stroke="url(#purpleBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="618" y1="21" x2="820" y2="21" stroke="#EC4899" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
