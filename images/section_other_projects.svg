<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="70" y1="27" x2="234" y2="27" stroke="#00E5FF" stroke-width="12" stroke-opacity="0.16" stroke-linecap="round" />
  <line x1="70" y1="27" x2="234" y2="27" stroke="url(#cyanBeamGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="237" cy="27" r="7" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="237" cy="27" r="4.2" fill="#00E5FF" />
  <circle cx="237" cy="27" r="1.8" fill="#FFFFFF" />

  <!-- Badge Icon -->
  <g transform="translate(254, 13)">
    <circle cx="14" cy="14" r="13" fill="#070C16" stroke="#00E5FF" stroke-width="2"/>

    <!-- Folder Icon -->
    <path d="M5 8 C5 7 6 6 7.5 6 H11 L13.5 9 H20.5 C21.5 9 22.5 10 22.5 11.5 V20 C22.5 21 21.5 22 20.5 22 H7.5 C6 22 5 21 5 20 Z" fill="none" stroke="#00E5FF" stroke-width="1.6" />
    <line x1="5" y1="12" x2="22.5" y2="12" stroke="#00E5FF" stroke-width="1.4" />
  </g>

  <!-- Title Text -->
  <text x="450" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="25" font-weight="900" letter-spacing="4.5" fill="url(#headerGrad)">OTHER PROJECTS</text>

  <!-- Right Cyber Beam -->
  <circle cx="615" cy="27" r="7" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="615" cy="27" r="4.2" fill="#EC4899" />
  <circle cx="615" cy="27" r="1.8" fill="#FFFFFF" />
  <line x1="618" y1="27" x2="830" y2="27" stroke="url(#purpleBeamGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="618" y1="27" x2="830" y2="27" stroke="#EC4899" stroke-width="12" stroke-opacity="0.16" stroke-linecap="round" />
