<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="21" x2="320" y2="21" stroke="#00E5FF" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="21" x2="320" y2="21" stroke="url(#cyanBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="322" cy="21" r="5" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="322" cy="21" r="3.2" fill="#00E5FF" />
  <circle cx="322" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Badge Icon -->
  <g transform="translate(334, 11)">
    <circle cx="10" cy="10" r="9" fill="#070C16" stroke="#00E5FF" stroke-width="1.6"/>

    <!-- Rocket Icon -->
    <path d="M10 4 C13 7 14 11 13 14 L11 14 L10 13 L9 14 L7 14 C6 11 7 7 10 4 Z" fill="none" stroke="#00E5FF" stroke-width="1.3" />
    <path d="M7 11 L5 13 L5 14 L7 14" fill="none" stroke="#00E5FF" stroke-width="1.2" />
    <path d="M13 11 L15 13 L15 14 L13 14" fill="none" stroke="#00E5FF" stroke-width="1.2" />
    <circle cx="10" cy="8.5" r="1.2" fill="#00E5FF" />
  </g>

  <!-- Title Text -->
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="url(#headerGrad)">TOP PROJECTS</text>

  <!-- Right Cyber Beam -->
  <circle cx="546" cy="21" r="5" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="546" cy="21" r="3.2" fill="#EC4899" />
  <circle cx="546" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="548" y1="21" x2="820" y2="21" stroke="url(#purpleBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="548" y1="21" x2="820" y2="21" stroke="#EC4899" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
