<svg xmlns="http://www.w3.org/2000/svg" width="940" height="150" viewBox="0 0 940 150" role="img" aria-labelledby="title desc">
  <title id="title">Official GitHub Achievements</title>
  <desc id="desc">White heading with cyan-to-purple gradient accents and a slim glowing beam with circular nodes on a dark background.</desc>
  <defs>
    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="52%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="52%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="940" height="150" rx="12" fill="#0D1117"/>
  <text x="470" y="63" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="url(#heading)">Official GitHub Achievements</text>
  <g transform="translate(0 0)">
    <circle cx="70" cy="118" r="4" fill="#00E5FF"/>
    <circle cx="94" cy="118" r="6" fill="#00E5FF"/>
    <circle cx="123" cy="118" r="8" fill="#00E5FF"/>
    <rect x="143" y="112" width="644" height="12" rx="6" fill="url(#beam)" opacity=".2"/>
    <rect x="143" y="113" width="644" height="10" rx="5" fill="url(#beam)" filter="url(#softGlow)"/>
    <circle cx="271" cy="118" r="16" fill="#0D1117" stroke="#00D9FF" stroke-width="3"/>
    <circle cx="271" cy="118" r="6" fill="#00D9FF"/>
    <circle cx="659" cy="118" r="16" fill="#0D1117" stroke="#9333EA" stroke-width="3"/>
    <circle cx="659" cy="118" r="6" fill="#9333EA"/>
    <circle cx="808" cy="118" r="8" fill="#A855F7"/>
    <circle cx="837" cy="118" r="6" fill="#A855F7"/>
    <circle cx="861" cy="118" r="4" fill="#A855F7"/>
  </g>
</svg>