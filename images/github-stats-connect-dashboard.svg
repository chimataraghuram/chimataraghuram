<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="600" viewBox="0 0 2048 600" role="img" aria-labelledby="title desc">
<title id="title">GitHub Stats and Connect Dashboard</title>
<desc id="desc">A dark futuristic dashboard with colorful stat cards and connection links.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1118"/><stop offset="1" stop-color="#111722"/></linearGradient>
 <linearGradient id="cyanPurple"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <linearGradient id="violet"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
 <linearGradient id="blue"><stop stop-color="#0284c7"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
 <linearGradient id="amber"><stop stop-color="#b45309"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
 <linearGradient id="rose"><stop stop-color="#e11d48"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
 <linearGradient id="green"><stop stop-color="#059669"/><stop offset="1" stop-color="#34d399"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
 <style>
 .head{font:700 34px Arial,sans-serif;letter-spacing:7px;fill:url(#cyanPurple)} .label{font:600 18px Arial,sans-serif;letter-spacing:1px;fill:#b8c2d3}.value{font:700 31px Arial,sans-serif}.pill{fill:#151c26;stroke:#303a48;stroke-width:2}.link{font:700 17px Arial,sans-serif;letter-spacing:.7px;fill:#edf2f8}
 </style>
</defs>
<rect width="2048" height="600" rx="24" fill="url(#bg)"/>
<text x="1024" y="70" text-anchor="middle" class="head">GITHUB STATS</text>
<path d="M100 56 H720 M1328 56 H1948" stroke="url(#cyanPurple)" stroke-width="3"/><circle cx="100" cy="56" r="7" fill="#22d3ee"/><circle cx="1948" cy="56" r="7" fill="#a855f7"/>
<!-- stat pills -->
<g transform="translate(60 125)">
 <rect class="pill" width="370" height="100" rx="50"/><circle cx="52" cy="50" r="37" fill="#7c3aed" opacity=".22"/><circle cx="52" cy="50" r="30" fill="url(#violet)"/><path d="M32 50 Q52 29 72 50 Q52 71 32 50Z" fill="#fff"/><circle cx="52" cy="50" r="8" fill="#7c3aed"/><path d="M105 18 V82" stroke="#7c3aed" stroke-width="2"/><text x="126" y="38" class="label">PROFILE VIEWS</text><text x="126" y="77" class="value" fill="#a855f7">2,015</text>
</g>
