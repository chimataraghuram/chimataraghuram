 <rect class="pill" width="380" height="100" rx="50"/><circle cx="52" cy="50" r="37" fill="#fb7185" opacity=".2"/><circle cx="52" cy="50" r="30" fill="url(#rose)"/><path d="M37 56 L44 40 65 31 60 54 47 65Z" fill="#fff"/><path d="M44 40 L53 50 65 31Z" fill="#ffd1da"/><path d="M105 18 V82" stroke="#fb7185" stroke-width="2"/><text x="126" y="38" class="label">DEPLOYMENTS</text><text x="126" y="77" class="value" fill="#fb7185">1,841</text>
</g>
<g transform="translate(1550 125)">
 <rect class="pill" width="438" height="100" rx="50"/><circle cx="52" cy="50" r="37" fill="#10b981" opacity=".2"/><circle cx="52" cy="50" r="30" fill="url(#green)"/><rect x="37" y="35" width="30" height="30" rx="5" fill="#063b32"/><path d="M43 43 H61 V48 H43Z M43 52 H56 V57 H43Z" fill="#6ee7b7"/><path d="M105 18 V82" stroke="#10b981" stroke-width="2"/><text x="126" y="38" class="label">REPOSITORIES</text><text x="126" y="77" class="value" fill="#34d399">24</text>
</g>
