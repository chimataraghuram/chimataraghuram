<g transform="translate(760 410)"><rect width="360" height="86" rx="43" fill="#141b24" stroke="#0ea5e9" stroke-width="2"/><circle cx="43" cy="43" r="31" fill="url(#blue)"/><circle cx="43" cy="43" r="15" fill="none" stroke="#fff" stroke-width="4"/><circle cx="43" cy="43" r="5" fill="#fff"/><text x="88" y="50" class="link">ACTIVELY LOOKING</text><path d="M316 43 h20 m-8-8 8 8-8 8" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(1150 410)"><rect width="520" height="86" rx="43" fill="#141b24" stroke="#f43f5e" stroke-width="2"/><circle cx="43" cy="43" r="31" fill="url(#rose)"/><rect x="27" y="32" width="32" height="23" rx="3" fill="none" stroke="#fff" stroke-width="3"/><path d="M28 34 L43 46 58 34" fill="none" stroke="#fff" stroke-width="3"/><text x="88" y="50" class="link">CHIMATARAGHURAM02A@GMAIL.COM</text><path d="M474 43 h20 m-8-8 8 8-8 8" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/></g>
<g transform="translate(1700 410)"><rect width="288" height="86" rx="43" fill="#141b24" stroke="#a855f7" stroke-width="2"/><circle cx="43" cy="43" r="31" fill="url(#violet)"/><text x="43" y="54" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="31" fill="#fff">in</text><text x="88" y="50" class="link">LINKEDIN</text><path d="M245 43 h20 m-8-8 8 8-8 8" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/></g>
<text x="1024" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#64748b">AI • FULL-STACK DEVELOPMENT • CLOUD &amp; AUTOMATION</text>
</svg>