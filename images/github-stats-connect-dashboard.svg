 <rect class="pill" width="330" height="100" rx="50"/><circle cx="52" cy="50" r="37" fill="#0284c7" opacity=".22"/><circle cx="52" cy="50" r="30" fill="url(#blue)"/><circle cx="44" cy="42" r="9" fill="#fff"/><circle cx="61" cy="44" r="8" fill="#fff"/><path d="M29 68 Q30 53 44 53 Q58 53 59 68Z M51 68 Q52 55 64 56 Q75 57 76 68Z" fill="#fff"/><path d="M105 18 V82" stroke="#0ea5e9" stroke-width="2"/><text x="126" y="38" class="label">FOLLOWERS</text><text x="126" y="77" class="value" fill="#22baff">14</text>
</g>
