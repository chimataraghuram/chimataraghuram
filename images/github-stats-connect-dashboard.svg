<text x="1024" y="365" text-anchor="middle" class="head">CONNECT &amp; MORE</text>
<path d="M100 351 H805 M1243 351 H1948" stroke="url(#cyanPurple)" stroke-width="3"/><circle cx="100" cy="351" r="7" fill="#22d3ee"/><circle cx="1948" cy="351" r="7" fill="#a855f7"/>
<!-- connection cards -->
<g transform="translate(60 410)"><rect width="300" height="86" rx="43" fill="#141b24" stroke="#f59e0b" stroke-width="2"/><circle cx="43" cy="43" r="31" fill="url(#amber)"/><text x="43" y="51" text-anchor="middle" font-size="27" font-weight="bold" fill="#fff">&lt;/&gt;</text><text x="88" y="50" class="link">LEETCODE</text><path d="M258 43 h20 m-8-8 8 8-8 8" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/></g>
