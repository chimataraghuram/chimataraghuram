<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" width="210" height="48">
  <defs>
    <!-- Cyan to Magenta/Purple gradient border -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="40%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Pill -->
  <rect x="5" y="5" width="200" height="38" rx="19" fill="#030A1A" stroke="url(#neonBorder)" stroke-width="2.5" filter="url(#badgeGlow)" opacity="0.8" />

  <!-- Crisp Core Pill -->
  <rect x="5" y="5" width="200" height="38" rx="19" fill="#040D21" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Emoji / Icon: Sparkles ✨ or User icon -->
  <text x="24" y="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="18">✨</text>

  <!-- ABOUT ME text with glowing gradient -->
  <text x="54" y="29" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="16" letter-spacing="1.5" fill="url(#neonText)">
    ABOUT ME
  </text>
</svg>
