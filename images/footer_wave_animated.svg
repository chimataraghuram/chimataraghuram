<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 980 120"
  width="100%"
  height="auto"
  preserveAspectRatio="none"
>
  <defs>
    <!-- Background Gradient for Upper Wave Band (Cyan -> Teal -> Dark Blue -> Violet -> Purple) -->
    <linearGradient id="footerWaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="30%" stop-color="#0EA5E9" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Background Gradient for Lower Wave Band (Muted Teal to Violet) -->
    <linearGradient id="footerWaveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007B99" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#005B85" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#00356E" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#4B1270" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6B138A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Wave Edge Glow -->
    <filter id="footerWaveEdgeGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== ANIMATED FLOWING WAVE (AUTHENTIC WAVE MOTION) ==================== -->
  <g id="footerWaveTheme">
    <!-- 1. Ambient Background Flowing Wave Ribbon Layer -->
    <path fill="url(#footerWaveGrad2)" opacity="0.6">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.2 0 0.2 1; 0.2 0 0.2 1; 0.2 0 0.2 1"
        begin="-10s"
        values="
          M-30,120 L-30,70.0 Q230.0,10.0 490.0,55.0 T1010.0,35.0 L1010.0,120 Z;
          M-30,120 L-30,45.0 Q230.0,85.0 490.0,85.0 T1010.0,65.0 L1010.0,120 Z;
          M-30,120 L-30,50.0 Q230.0,80.0 490.0,45.0 T1010.0,25.0 L1010.0,120 Z;
          M-30,120 L-30,70.0 Q230.0,10.0 490.0,55.0 T1010.0,35.0 L1010.0,120 Z"
      />
    </path>

    <!-- 2. Primary Vibrant Flowing Wave Ribbon Layer -->
    <path fill="url(#footerWaveGrad1)" opacity="0.85">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.2 0 0.2 1; 0.2 0 0.2 1; 0.2 0 0.2 1"
        begin="0s"
        values="
          M-30,120 L-30,85.0 Q230.0,35.0 490.0,75.0 T1010.0,40.0 L1010.0,120 Z;
          M-30,120 L-30,50.0 Q230.0,35.0 490.0,55.0 T1010.0,75.0 L1010.0,120 Z;
          M-30,120 L-30,25.0 Q230.0,70.0 490.0,25.0 T1010.0,75.0 L1010.0,120 Z;
          M-30,120 L-30,85.0 Q230.0,35.0 490.0,75.0 T1010.0,40.0 L1010.0,120 Z"
      />
    </path>

    <!-- 3. Neon Luminous Wave Crest Stroke Line 1 -->
    <path fill="none" stroke="url(#footerWaveGrad1)" stroke-width="1.8" opacity="0.95" filter="url(#footerWaveEdgeGlow)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.2 0 0.2 1; 0.2 0 0.2 1; 0.2 0 0.2 1"
        begin="0s"
        values="
          M-30,85.0 Q230.0,35.0 490.0,75.0 T1010.0,40.0;
          M-30,50.0 Q230.0,35.0 490.0,55.0 T1010.0,75.0;
          M-30,25.0 Q230.0,70.0 490.0,25.0 T1010.0,75.0;
          M-30,85.0 Q230.0,35.0 490.0,75.0 T1010.0,40.0"
      />
    </path>

    <!-- 4. Glowing Base Wave Crest Stroke Line 2 -->
    <path fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.75" filter="url(#footerWaveEdgeGlow)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.2 0 0.2 1; 0.2 0 0.2 1; 0.2 0 0.2 1"
        begin="-10s"
        values="
          M-30,70.0 Q230.0,10.0 490.0,55.0 T1010.0,35.0;
          M-30,45.0 Q230.0,85.0 490.0,85.0 T1010.0,65.0;
          M-30,50.0 Q230.0,80.0 490.0,45.0 T1010.0,25.0;
          M-30,70.0 Q230.0,10.0 490.0,55.0 T1010.0,35.0"
      />
    </path>
  </g>
</svg>
