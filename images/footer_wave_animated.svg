<svg
  width="100%"
  height="120"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 980 120"
>
  <defs>
    <!-- Waving Background Gradient (Purple to Cyan matching profile theme) -->
    <linearGradient id="footerWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <style>
    .footer-wave {
      transform: rotate(180deg);
      transform-origin: 50% 50%;
    }
  </style>

  <!-- Full Pure Animated Flowing Waves across 100% width -->
  <g class="footer-wave" transform="translate(490, 60) scale(1.35, 1.0) translate(-427, -60)">
    <path fill="url(#footerWaveGrad)" opacity="0.6">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 35Q 213.5 85 427 45T 854 80L 854 0 Z;M0 0L 0 70Q 213.5 85 427 65T 854 45L 854 0 Z;M0 0L 0 95Q 213.5 50 427 95T 854 45L 854 0 Z;M0 0L 0 35Q 213.5 85 427 45T 854 80L 854 0 Z" />
    </path>
    <path fill="url(#footerWaveGrad)" opacity="0.5">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-10s"
        values="M0 0L 0 50Q 213.5 110 427 65T 854 85L 854 0 Z;M0 0L 0 75Q 213.5 35 427 35T 854 55L 854 0 Z;M0 0L 0 70Q 213.5 40 427 75T 854 95L 854 0 Z;M0 0L 0 50Q 213.5 110 427 65T 854 85L 854 0 Z" />
    </path>
  </g>
</svg>