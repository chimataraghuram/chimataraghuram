<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="connGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="connBeamL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="connBeamR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="21" x2="305" y2="21" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="21" x2="305" y2="21" stroke="url(#connBeamL)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="307" cy="21" r="5" fill="#38BDF8" fill-opacity="0.25" />
  <circle cx="307" cy="21" r="3.2" fill="#38BDF8" />
  <circle cx="307" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Globe / Network Icon -->
  <g transform="translate(320, 11)">
    <circle cx="10" cy="10" r="9" fill="#070C16" stroke="#A855F7" stroke-width="1.6"/>
    <ellipse cx="10" cy="10" rx="4" ry="9" fill="none" stroke="#A855F7" stroke-width="1.3"/>
    <line x1="1" y1="10" x2="19" y2="10" stroke="#A855F7" stroke-width="1.3"/>
  </g>

  <!-- Title Text -->
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="url(#connGrad)">CONNECT &amp; STATUS</text>

  <!-- Right Cyber Beam -->
  <circle cx="593" cy="21" r="5" fill="#10B981" fill-opacity="0.25" />
  <circle cx="593" cy="21" r="3.2" fill="#10B981" />
  <circle cx="593" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="595" y1="21" x2="820" y2="21" stroke="url(#connBeamR)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="595" y1="21" x2="820" y2="21" stroke="#10B981" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
