<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="940" height="92" viewBox="0 0 940 92">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B26"/>
      <stop offset="100%" stop-color="#0B1017"/>
    </linearGradient>

    <!-- Circle Icon Gradients -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .card-border {
      fill: #0D131D;
      stroke: #222F3E;
      stroke-width: 1.5;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", Helvetica, Arial, sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #8E9BAE;
    }
    .stat-value {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    a {
      cursor: pointer;
    }
  </style>

  <!-- CARD 1: PROFILE VIEWS (x=0, w=180) -->
  <a xlink:href="https://komarev.com/ghpvc/?username=chimataraghuram" target="_blank">
    <g transform="translate(0, 16)">
      <rect x="0.75" y="0.75" width="178.5" height="58.5" rx="29.25" fill="#0D131D" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="25" fill="#7C3AED" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="21" fill="url(#violetGrad)"/>
      <path d="M18 30 Q30 17 42 30 Q30 43 18 30 Z" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="30" cy="30" r="5" fill="#FFFFFF"/>
      <line x1="60" y1="14" x2="60" y2="46" stroke="#222F3E" stroke-width="1.2"/>
      <text x="70" y="27" class="stat-label">PROFILE VIEWS</text>
      <text x="70" y="49" class="stat-value" fill="#A78BFA">2,090</text>
    </g>
  </a>

  <!-- CARD 2: FOLLOWERS (x=190, w=172) -->
  <a xlink:href="https://github.com/chimataraghuram?tab=followers" target="_blank">
    <g transform="translate(190, 16)">
      <rect x="0.75" y="0.75" width="170.5" height="58.5" rx="29.25" fill="#0D131D" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="25" fill="#0284C7" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="21" fill="url(#blueGrad)"/>
      <circle cx="26" cy="24" r="5" fill="#FFFFFF"/>
      <circle cx="36" cy="26" r="4.2" fill="#FFFFFF" fill-opacity="0.85"/>
      <path d="M16 40 Q16 33 26 33 Q36 33 36 40 Z" fill="#FFFFFF"/>
      <path d="M34 40 Q34 35 41 35 Q46 35 46 40 Z" fill="#FFFFFF" fill-opacity="0.85"/>
      <line x1="60" y1="14" x2="60" y2="46" stroke="#222F3E" stroke-width="1.2"/>
      <text x="70" y="27" class="stat-label">FOLLOWERS</text>
      <text x="70" y="49" class="stat-value" fill="#38BDF8">14</text>
    </g>
  </a>

  <!-- CARD 3: STARS (x=372, w=156) -->
  <a xlink:href="https://github.com/chimataraghuram?tab=repositories" target="_blank">
    <g transform="translate(372, 16)">
      <rect x="0.75" y="0.75" width="154.5" height="58.5" rx="29.25" fill="#0D131D" stroke="#D97706" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="25" fill="#D97706" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="21" fill="url(#amberGrad)"/>
      <polygon points="30,17 34,25.5 43,26.5 36.5,32.5 38.5,41.5 30,36.5 21.5,41.5 23.5,32.5 17,26.5 26,25.5" fill="#FFFFFF"/>
      <line x1="60" y1="14" x2="60" y2="46" stroke="#222F3E" stroke-width="1.2"/>
      <text x="70" y="27" class="stat-label">STARS</text>
      <text x="70" y="49" class="stat-value" fill="#FBBF24">50</text>
    </g>
  </a>

  <!-- CARD 4: DEPLOYMENTS (x=538, w=192) -->
  <a xlink:href="https://github.com/chimataraghuram?tab=repositories" target="_blank">
    <g transform="translate(538, 16)">
      <rect x="0.75" y="0.75" width="190.5" height="58.5" rx="29.25" fill="#0D131D" stroke="#E11D48" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="25" fill="#E11D48" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="21" fill="url(#roseGrad)"/>
      <g transform="translate(30, 30) rotate(-45)">
        <path d="M0 -11 C5 -8 7 -1 7 8 L-7 8 C-7 -1 -5 -8 0 -11 Z" fill="#FFFFFF"/>
        <circle cx="0" cy="1" r="2.5" fill="#E11D48"/>
        <path d="M-7 5 L-11 11 L-7 9 Z" fill="#FFFFFF"/>
        <path d="M7 5 L11 11 L7 9 Z" fill="#FFFFFF"/>
        <polygon points="-3,9 0,14 3,9" fill="#FDE047"/>
      </g>
      <line x1="60" y1="14" x2="60" y2="46" stroke="#222F3E" stroke-width="1.2"/>
      <text x="70" y="27" class="stat-label">DEPLOYMENTS</text>
      <text x="70" y="49" class="stat-value" fill="#FB7185">1,841</text>
    </g>
  </a>

  <!-- CARD 5: REPOSITORIES (x=740, w=198) -->
  <a xlink:href="https://github.com/chimataraghuram?tab=repositories" target="_blank">
    <g transform="translate(740, 16)">
      <rect x="0.75" y="0.75" width="196.5" height="58.5" rx="29.25" fill="#0D131D" stroke="#059669" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="25" fill="#059669" fill-opacity="0.15"/>
      <circle cx="30" cy="30" r="21" fill="url(#emeraldGrad)"/>
      <g transform="translate(20, 20)">
        <path d="M2 3 A2 2 0 0 1 4 1 H18 A2 2 0 0 1 20 3 V17 A2 2 0 0 1 18 19 H4 A2 2 0 0 1 2 17 Z" fill="#064E3B"/>
        <path d="M5 2 H17 A1 1 0 0 1 18 3 V17 A1 1 0 0 1 17 18 H5 Z" fill="#FFFFFF"/>
        <line x1="7" y1="6" x2="15" y2="6" stroke="#064E3B" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="7" y1="10" x2="13" y2="10" stroke="#064E3B" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="7" y1="14" x2="11" y2="14" stroke="#064E3B" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <line x1="60" y1="14" x2="60" y2="46" stroke="#222F3E" stroke-width="1.2"/>
      <text x="70" y="27" class="stat-label">REPOSITORIES</text>
      <text x="70" y="49" class="stat-value" fill="#34D399">24</text>
    </g>
  </a>
</svg>
