<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="100%" height="130">
  <defs>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C026D3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber frame background (borderless) -->
  <rect x="0" y="0" width="1000" height="130" fill="transparent" />

  <!-- Accent slashes on top-left -->
  <line x1="32" y1="38" x2="52" y2="18" stroke="#C026D3" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
  <line x1="46" y1="38" x2="66" y2="18" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />

  <!-- Cyber decorative pixel dots on right -->
  <g fill="#00E5FF" opacity="0.4">
    <rect x="920" y="25" width="4" height="4" rx="1" />
    <rect x="930" y="25" width="4" height="4" rx="1" />
    <rect x="940" y="25" width="4" height="4" rx="1" />
    <rect x="925" y="35" width="4" height="4" rx="1" fill="#C026D3" opacity="0.6" />
    <rect x="935" y="35" width="4" height="4" rx="1" />
    <rect x="945" y="35" width="4" height="4" rx="1" fill="#C026D3" opacity="0.6" />
    <rect x="930" y="45" width="4" height="4" rx="1" />
    <rect x="940" y="45" width="4" height="4" rx="1" />
  </g>

  <!-- Main Title -->
  <g text-anchor="middle">
    <text x="500" y="64" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="1.5">
      <tspan fill="#FFFFFF">HELLO! I'M </tspan>
      <tspan fill="url(#neonTitle)" filter="url(#neonGlow)">CHIMATA RAGHURAM</tspan>
      <tspan fill="#FFD23F"> 👋</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="18" fill="#94A3B8" letter-spacing="0.5">
      Python Full-Stack Developer <tspan fill="#00E5FF">•</tspan> Actively Learning and Tech Enthusiast
    </text>
  </g>
</svg>
