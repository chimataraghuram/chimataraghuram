<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 135" width="100%" height="135">
  <defs>
    <!-- Vibrant title gradient: cyan -> magenta -> neon purple -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#D946EF" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="1" />
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle circuit grid pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#D946EF" fill-opacity="0.2" />
    </pattern>

    <!-- Soft ambient neon glow filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background subtle grid -->
  <rect x="0" y="0" width="1000" height="135" fill="url(#circuitGrid)" />

  <!-- Accent slashes on top-left -->
  <g filter="url(#subtleGlow)">
    <line x1="36" y1="36" x2="56" y2="16" stroke="#D946EF" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
    <line x1="50" y1="36" x2="70" y2="16" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- Futuristic corner particles on top-right -->
  <g fill="#00E5FF" opacity="0.6">
    <rect x="915" y="20" width="4" height="4" rx="1" />
    <rect x="927" y="20" width="4" height="4" rx="1" fill="#D946EF" />
    <rect x="939" y="20" width="4" height="4" rx="1" />
    <rect x="951" y="20" width="4" height="4" rx="1" fill="#A855F7" />

    <rect x="921" y="30" width="4" height="4" rx="1" fill="#D946EF" />
    <rect x="933" y="30" width="4" height="4" rx="1" />
    <rect x="945" y="30" width="4" height="4" rx="1" fill="#00E5FF" />
  </g>

  <!-- Main Title -->
  <g text-anchor="middle">
    <!-- Glowing background layer for title -->
    <text x="500" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="url(#neonTitle)" opacity="0.6" filter="url(#neonGlow)">
      HELLO! I'M CHIMATA RAGHURAM 👋
    </text>
    <!-- Sharp foreground layer for title -->
    <text x="500" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="2">
      <tspan fill="#FFFFFF">HELLO! I'M </tspan>
      <tspan fill="url(#neonTitle)" filter="url(#subtleGlow)">CHIMATA RAGHURAM</tspan>
      <tspan fill="#FFD23F"> 👋</tspan>
    </text>

    <!-- Subtitle -->
    <text x="500" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="17" fill="#CBD5E1" letter-spacing="0.5">
      Python Full-Stack Developer <tspan fill="#00E5FF" font-weight="700">•</tspan> Actively Learning and Tech Enthusiast
    </text>

    <!-- Glowing accent underline underneath subtitle -->
    <line x1="280" y1="112" x2="720" y2="112" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" filter="url(#subtleGlow)" />
  </g>
</svg>
