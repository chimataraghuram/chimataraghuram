<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 135" width="100%" height="135">
  <defs>
    <!-- Vibrant title gradient: cyan -> magenta -> neon purple -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#D946EF" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="1" />
      <stop offset="75%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle circuit grid pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#D946EF" fill-opacity="0.2" />
    </pattern>

    <!-- Pulsing ambient glow filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typewriter clip paths -->
    <!-- Full text width is around 760px. We animate the clip path width to reveal the text letter-by-letter like a typewriter! -->
    <clipPath id="typewriterClip">
      <rect x="120" y="20" width="0" height="55">
        <!-- Types out from 0 to 760 over 3.2s, pauses till 7s, then repeats -->
        <animate attributeName="width" values="0; 0; 760; 760; 0" keyTimes="0; 0.08; 0.55; 0.92; 1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    /* Blinking typing caret cursor */
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes moveCursor {
      0%, 8% { transform: translateX(122px); opacity: 1; }
      55%, 92% { transform: translateX(878px); opacity: 1; }
      96%, 100% { transform: translateX(122px); opacity: 0; }
    }
    .typing-cursor {
      animation: moveCursor 7s infinite linear, blinkCaret 0.8s infinite;
    }

    @keyframes slashPulse {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1.5px); }
    }
    .slash-anim {
      animation: slashPulse 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .dot-1 { animation: twinkle 1.8s infinite ease-in-out; }
    .dot-2 { animation: twinkle 2.4s infinite ease-in-out 0.4s; }
    .dot-3 { animation: twinkle 2.0s infinite ease-in-out 0.8s; }
  </style>

  <!-- Background subtle grid -->
  <rect x="0" y="0" width="1000" height="135" fill="url(#circuitGrid)" />

  <!-- Accent slashes on top-left -->
  <g class="slash-anim" filter="url(#subtleGlow)">
    <line x1="36" y1="36" x2="56" y2="16" stroke="#D946EF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="50" y1="36" x2="70" y2="16" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Cyber corner particles on top-right -->
  <g fill="#00E5FF">
    <rect class="dot-1" x="915" y="20" width="4" height="4" rx="1" />
    <rect class="dot-2" x="927" y="20" width="4" height="4" rx="1" fill="#D946EF" />
    <rect class="dot-3" x="939" y="20" width="4" height="4" rx="1" />
    <rect class="dot-1" x="951" y="20" width="4" height="4" rx="1" fill="#A855F7" />

    <rect class="dot-3" x="921" y="30" width="4" height="4" rx="1" fill="#D946EF" />
    <rect class="dot-1" x="933" y="30" width="4" height="4" rx="1" />
    <rect class="dot-2" x="945" y="30" width="4" height="4" rx="1" fill="#00E5FF" />
  </g>

  <!-- Typewriter animated Main Title -->
  <g clip-path="url(#typewriterClip)">
    <g text-anchor="middle">
      <text x="500" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="2">
        <tspan fill="#FFFFFF">HELLO! I'M </tspan>
        <tspan fill="url(#neonTitle)" filter="url(#subtleGlow)">CHIMATA RAGHURAM</tspan>
        <tspan fill="#FFD23F"> 👋</tspan>
      </text>
    </g>
  </g>

  <!-- Blinking Neon Writing Cursor -->
  <rect class="typing-cursor" y="28" width="4" height="34" rx="2" fill="#00E5FF" filter="url(#subtleGlow)" />

  <!-- Subtitle -->
  <g text-anchor="middle">
    <text x="500" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="17" fill="#CBD5E1" letter-spacing="0.5">
      Python Full-Stack Developer <tspan fill="#00E5FF" font-weight="700">•</tspan> Actively Learning and Tech Enthusiast
    </text>

    <!-- Glowing accent underline underneath subtitle -->
    <line x1="280" y1="112" x2="720" y2="112" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)" />
  </g>
</svg>
