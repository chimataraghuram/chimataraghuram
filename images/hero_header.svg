<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 135" width="100%" height="135">
  <defs>
    <!-- Smooth flowing animated neon gradient -->
    <linearGradient id="animatedTitleGrad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#D946EF;#7C3AED;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#D946EF">
        <animate attributeName="stop-color" values="#D946EF;#7C3AED;#00E5FF;#D946EF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#00E5FF;#D946EF;#7C3AED" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00E5FF">
        <animate attributeName="stop-color" values="#00E5FF;#D946EF;#7C3AED;#00E5FF" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated accent underline gradient -->
    <linearGradient id="animatedUnderline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.9">
        <animate attributeName="offset" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="1" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9">
        <animate attributeName="offset" values="0.9;0.6;0.9" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Subtle circuit grid pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#D946EF" fill-opacity="0.2" />
    </pattern>

    <!-- Pulsing ambient glow filters -->
    <filter id="neonGlowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wave {
      0% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-8deg); }
      45% { transform: rotate(14deg); }
      60% { transform: rotate(-4deg); }
      75% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }
    .waving-hand {
      transform-origin: 755px 45px;
      animation: wave 2.2s infinite ease-in-out;
      display: inline-block;
    }

    @keyframes pulseOpacity {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.95; }
    }
    .pulse-glow {
      animation: pulseOpacity 3.5s infinite ease-in-out;
    }

    @keyframes slashPulse {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-1.5px); }
    }
    .slash-anim {
      animation: slashPulse 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .dot-1 { animation: twinkle 1.8s infinite ease-in-out; }
    .dot-2 { animation: twinkle 2.4s infinite ease-in-out 0.4s; }
    .dot-3 { animation: twinkle 2.0s infinite ease-in-out 0.8s; }
  </style>

  <!-- Background subtle grid -->
  <rect x="0" y="0" width="1000" height="135" fill="url(#circuitGrid)" />

  <!-- Accent slashes on top-left (animated) -->
  <g class="slash-anim" filter="url(#subtleGlow)">
    <line x1="36" y1="36" x2="56" y2="16" stroke="#D946EF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="50" y1="36" x2="70" y2="16" stroke="#00E5FF" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Cyber corner particles on top-right (animated twinkle) -->
  <g fill="#00E5FF">
    <rect class="dot-1" x="915" y="20" width="4" height="4" rx="1" />
    <rect class="dot-2" x="927" y="20" width="4" height="4" rx="1" fill="#D946EF" />
    <rect class="dot-3" x="939" y="20" width="4" height="4" rx="1" />
    <rect class="dot-1" x="951" y="20" width="4" height="4" rx="1" fill="#A855F7" />

    <rect class="dot-3" x="921" y="30" width="4" height="4" rx="1" fill="#D946EF" />
    <rect class="dot-1" x="933" y="30" width="4" height="4" rx="1" />
    <rect class="dot-2" x="945" y="30" width="4" height="4" rx="1" fill="#00E5FF" />
  </g>

  <!-- Main Title -->
  <g text-anchor="middle">
    <!-- Pulsing ambient glow layer for title -->
    <text class="pulse-glow" x="500" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="url(#animatedTitleGrad)" filter="url(#neonGlowPulse)">
      HELLO! I'M CHIMATA RAGHURAM
    </text>

    <!-- Sharp foreground layer for title -->
    <text x="500" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="36" letter-spacing="2">
      <tspan fill="#FFFFFF">HELLO! I'M </tspan>
      <tspan fill="url(#animatedTitleGrad)" filter="url(#subtleGlow)">CHIMATA RAGHURAM</tspan>
    </text>

    <!-- Waving hand emoji with rotation animation -->
    <g class="waving-hand">
      <text x="755" y="60" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="34">👋</text>
    </g>

    <!-- Subtitle -->
    <text x="500" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="17" fill="#CBD5E1" letter-spacing="0.5">
      Python Full-Stack Developer <tspan fill="#00E5FF" font-weight="700">•</tspan> Actively Learning and Tech Enthusiast
    </text>

    <!-- Animated glowing accent underline underneath subtitle -->
    <line x1="280" y1="112" x2="720" y2="112" stroke="url(#animatedUnderline)" stroke-width="2.5" stroke-linecap="round" filter="url(#subtleGlow)" />
  </g>
</svg>
