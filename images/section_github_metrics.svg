<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="21" x2="315" y2="21" stroke="#00E5FF" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="21" x2="315" y2="21" stroke="url(#cyanBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="317" cy="21" r="5" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="317" cy="21" r="3.2" fill="#00E5FF" />
  <circle cx="317" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Terminal Pulse Icon -->
  <g transform="translate(330, 11)">
    <circle cx="10" cy="10" r="9" fill="#070C16" stroke="#00E5FF" stroke-width="1.6"/>
    <path d="M6 10 L9 13 L15 7" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Text -->
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="url(#headerGrad)">GITHUB METRICS</text>

  <!-- Right Cyber Beam -->
  <circle cx="583" cy="21" r="5" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="583" cy="21" r="3.2" fill="#EC4899" />
  <circle cx="583" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="585" y1="21" x2="820" y2="21" stroke="url(#purpleBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="585" y1="21" x2="820" y2="21" stroke="#EC4899" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
