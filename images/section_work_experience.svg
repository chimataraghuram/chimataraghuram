<svg xmlns="http://www.w3.org/2000/svg" width="900" height="42" viewBox="0 0 900 42">
  <defs>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="21" x2="300" y2="21" stroke="#00E5FF" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="21" x2="300" y2="21" stroke="url(#cyanBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="302" cy="21" r="5" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="302" cy="21" r="3.2" fill="#00E5FF" />
  <circle cx="302" cy="21" r="1.3" fill="#FFFFFF" />

  <!-- Briefcase Icon -->
  <g transform="translate(315, 11)">
    <circle cx="10" cy="10" r="9" fill="#070C16" stroke="#00E5FF" stroke-width="1.6"/>
    <!-- Modern Briefcase -->
    <rect x="5.5" y="8" width="9" height="7" rx="1.5" fill="none" stroke="#00E5FF" stroke-width="1.3" />
    <path d="M8 8 V6.5 C8 5.7 8.7 5 9.5 5 H10.5 C11.3 5 12 5.7 12 6.5 V8" fill="none" stroke="#00E5FF" stroke-width="1.3" />
    <line x1="5.5" y1="11" x2="14.5" y2="11" stroke="#00E5FF" stroke-width="1.1" />
  </g>

  <!-- Title Text -->
  <text x="450" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="4" fill="url(#expGrad)">WORK EXPERIENCE</text>

  <!-- Right Cyber Beam -->
  <circle cx="598" cy="21" r="5" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="598" cy="21" r="3.2" fill="#EC4899" />
  <circle cx="598" cy="21" r="1.3" fill="#FFFFFF" />
  <line x1="600" y1="21" x2="820" y2="21" stroke="url(#purpleBeamGrad)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="600" y1="21" x2="820" y2="21" stroke="#EC4899" stroke-width="8" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
