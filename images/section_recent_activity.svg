<svg xmlns="http://www.w3.org/2000/svg" width="900" height="48" viewBox="0 0 900 48">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Cyber Beam -->
  <line x1="80" y1="24" x2="271" y2="24" stroke="#00E5FF" stroke-width="10" stroke-opacity="0.15" stroke-linecap="round" />
  <line x1="80" y1="24" x2="271" y2="24" stroke="url(#cyanBeamGrad)" stroke-width="2.6" stroke-linecap="round" />
  <circle cx="274" cy="24" r="6" fill="#00E5FF" fill-opacity="0.25" />
  <circle cx="274" cy="24" r="3.8" fill="#00E5FF" />
  <circle cx="274" cy="24" r="1.6" fill="#FFFFFF" />

  <!-- Badge Icon -->
  <g transform="translate(287, 12)">
    <circle cx="12" cy="12" r="11" fill="#070C16" stroke="#00E5FF" stroke-width="1.8"/>

    <!-- Clock Icon -->
    <circle cx="12" cy="12" r="7" fill="none" stroke="#00E5FF" stroke-width="1.5" />
    <polyline points="12,8 12,12 15,12" fill="none" stroke="#00E5FF" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Title Text -->
  <text x="450" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="url(#headerGrad)">RECENT ACTIVITY</text>

  <!-- Right Cyber Beam -->
  <circle cx="587" cy="24" r="6" fill="#EC4899" fill-opacity="0.25" />
  <circle cx="587" cy="24" r="3.8" fill="#EC4899" />
  <circle cx="587" cy="24" r="1.6" fill="#FFFFFF" />
  <line x1="590" y1="24" x2="820" y2="24" stroke="url(#purpleBeamGrad)" stroke-width="2.6" stroke-linecap="round" />
  <line x1="590" y1="24" x2="820" y2="24" stroke="#EC4899" stroke-width="10" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
