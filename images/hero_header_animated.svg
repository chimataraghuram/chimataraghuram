<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 180" width="100%" height="auto">
  <defs>
    <!-- Background Gradient matching mockup -->
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C16" />
      <stop offset="100%" stop-color="#0A101D" />
    </linearGradient>

    <!-- Vibrant Gradient Text -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Cyan wave gradient -->
    <linearGradient id="cyanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Purple wave gradient -->
    <linearGradient id="purpleWave" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Pill border gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Caret Glow -->
    <filter id="caretGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing clip path: width 0 to 630px -->
    <clipPath id="typeClip">
      <rect x="0" y="10" width="0" height="56">
        <animate attributeName="width" values="0; 0; 635; 635; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(2px); opacity: 1; }
      50%, 90% { transform: translateX(628px); opacity: 1; }
      96%, 100% { transform: translateX(2px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(14deg); }
      80% { transform: rotate(-4deg); }
    }
    .caret {
      animation: moveCaret 6.5s infinite, blinkCaret 0.8s infinite;
    }
    .hand {
      transform-origin: 650px 48px;
      animation: waveHand 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Glowing Wave Accents (Left Cyan, Right Purple) -->
  <path d="M-10,135 Q180,95 380,140" fill="none" stroke="url(#cyanWave)" stroke-width="2.5" />
  <path d="M-10,145 Q160,110 360,140" fill="none" stroke="url(#cyanWave)" stroke-width="1.2" opacity="0.6" />
  <circle cx="100" cy="120" r="3" fill="#00E5FF" opacity="0.8" />
  <line x1="20" y1="120" x2="80" y2="120" stroke="#00E5FF" stroke-width="1" opacity="0.4" />

  <path d="M990,135 Q800,95 600,140" fill="none" stroke="url(#purpleWave)" stroke-width="2.5" />
  <path d="M990,145 Q820,110 620,140" fill="none" stroke="url(#purpleWave)" stroke-width="1.2" opacity="0.6" />
  <circle cx="880" cy="120" r="3" fill="#A855F7" opacity="0.8" />
  <line x1="900" y1="120" x2="960" y2="120" stroke="#A855F7" stroke-width="1" opacity="0.4" />

  <!-- Centered Animated Headline Group -->
  <g transform="translate(150, 0)">
    <!-- Clipped Animated Headline -->
    <g clip-path="url(#typeClip)">
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="0.8">
        <tspan fill="#FFFFFF">HELLO! I'M </tspan>
        <tspan fill="url(#nameGrad)">CHIMATA RAGHURAM</tspan>
      </text>
    </g>

    <!-- Neon Typing Cursor -->
    <rect class="caret" x="0" y="20" width="4" height="38" rx="2" fill="#00E5FF" filter="url(#caretGlow)" />

    <!-- Waving Hand Emoji -->
    <text class="hand" x="644" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="34">👋</text>

    <!-- Subtitle -->
    <text x="110" y="86" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="15" letter-spacing="0.4">
      Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast
    </text>

    <!-- Center Pill: AIML DIPLOMA HOLDER -->
    <g transform="translate(230, 110)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#0E1326" stroke="url(#pillGrad)" stroke-width="1.2" />
      <text x="110" y="19.5" text-anchor="middle" fill="#818CF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">AIML DIPLOMA HOLDER</text>
    </g>
    <!-- Accent line passing behind pill -->
    <line x1="80" y1="125" x2="225" y2="125" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
    <circle cx="225" cy="125" r="2.5" fill="#38BDF8" />
    <line x1="455" y1="125" x2="600" y2="125" stroke="#A855F7" stroke-width="1" opacity="0.6" />
    <circle cx="455" cy="125" r="2.5" fill="#A855F7" />
  </g>
</svg>