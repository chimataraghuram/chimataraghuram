<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 120" width="100%" height="auto">
  <defs>
    <!-- Modern Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Top Highlight Border Shimmer -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Vibrant Gradient Text -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Soft Typing Cursor Glow -->
    <filter id="caretGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing clip path: width 0 to 630px -->
    <clipPath id="typeClip">
      <rect x="36" y="22" width="0" height="52">
        <animate attributeName="width" values="0; 0; 630; 630; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(38px); opacity: 1; }
      50%, 90% { transform: translateX(625px); opacity: 1; }
      96%, 100% { transform: translateX(38px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .caret {
      animation: moveCaret 6.5s infinite cubic-bezier(0.4, 0, 0.2, 1), blinkCaret 0.8s infinite;
    }
  </style>

  <!-- Modern Dark Glass Card Surface -->
  <rect x="1" y="1" width="978" height="118" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Subtle Glowing Top Accent Border -->
  <line x1="20" y1="1" x2="960" y2="1" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Animated Typed Title -->
  <g clip-path="url(#typeClip)">
    <text x="40" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="32" letter-spacing="0.8">
      <tspan fill="#FFFFFF">HELLO! I'M </tspan>
      <tspan fill="url(#titleGrad)">CHIMATA RAGHURAM</tspan>
    </text>
  </g>

  <!-- Caret Cursor positioned cleanly after the M -->
  <rect class="caret" y="34" width="3.5" height="34" rx="1.5" fill="#00E5FF" filter="url(#caretGlow)" />

  <!-- Waving Hand placed cleanly after the caret -->
  <g transform="translate(642, 34)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 14 14; 16 14 14; 0 14 14; 16 14 14; 0 14 14" dur="2s" repeatCount="indefinite" />
      <text x="0" y="27" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="28">👋</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="40" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="15.5" fill="#94A3B8" letter-spacing="0.4">
    Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast
  </text>
</svg>