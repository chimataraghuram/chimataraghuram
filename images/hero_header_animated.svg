<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 120" width="100%" height="auto">
  <defs>
    <!-- Modern Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0E1526" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Subtle Top Highlight Border -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>

    <!-- Refined Modern Text Gradient -->
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Typing clip path: 40px to 498px -->
    <clipPath id="typeClip">
      <rect x="36" y="32" width="0" height="48">
        <animate attributeName="width" values="0; 0; 495; 495; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(38px); opacity: 1; }
      50%, 90% { transform: translateX(518px); opacity: 1; }
      96%, 100% { transform: translateX(38px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .caret {
      animation: moveCaret 6.5s infinite cubic-bezier(0.4, 0, 0.2, 1), blinkCaret 0.8s infinite;
    }
  </style>

  <!-- Modern Dark Card Surface with Subtle 1px Border -->
  <rect x="1" y="1" width="978" height="118" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1" />
  
  <!-- Subtle Top Highlight Line -->
  <line x1="20" y1="1" x2="960" y2="1" stroke="url(#topHighlight)" stroke-width="1.5" />

  <!-- Terminal Window Controls (Subtle, Modern) -->
  <circle cx="28" cy="22" r="4" fill="#EF4444" opacity="0.8" />
  <circle cx="42" cy="22" r="4" fill="#F59E0B" opacity="0.8" />
  <circle cx="56" cy="22" r="4" fill="#10B981" opacity="0.8" />

  <!-- Status Badge: Open to Work -->
  <g transform="translate(820, 11)">
    <rect width="136" height="22" rx="11" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="14" cy="11" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="15" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.6">OPEN TO WORK</text>
  </g>

  <!-- Animated Typed Headline -->
  <g clip-path="url(#typeClip)">
    <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="0.6">
      <tspan fill="#F8FAFC">HELLO! I'M </tspan>
      <tspan fill="url(#brandText)">CHIMATA RAGHURAM</tspan>
    </text>
  </g>

  <!-- Caret Cursor -->
  <rect class="caret" y="44" width="3" height="28" rx="1.5" fill="#38BDF8" />

  <!-- Waving Hand next to name (Clean SVG animateTransform) -->
  <g transform="translate(530, 45)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 12 12; 14 12 12; 0 12 12; 14 12 12; 0 12 12" dur="2s" repeatCount="indefinite" />
      <text x="0" y="22" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="24">👋</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="40" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="14.5" fill="#94A3B8" letter-spacing="0.3">
    Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast
  </text>
</svg>