<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 135" width="100%" height="auto">
  <defs>
    <!-- Vibrant Gradient Text -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Pill border gradient (Cyan to Purple) -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing clip path: width 0 to 635px -->
    <clipPath id="typeClip">
      <rect x="0" y="10" width="0" height="56">
        <animate attributeName="width" values="0; 0; 635; 635; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(2px); opacity: 1; }
      50%, 90% { transform: translateX(628px); opacity: 1; }
      96%, 100% { transform: translateX(2px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(14deg); }
      80% { transform: rotate(-4deg); }
    }
    .caret {
      animation: moveCaret 6.5s infinite, blinkCaret 0.8s infinite;
    }
    .hand {
      transform-origin: 648px 48px;
      animation: waveHand 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Top Animated Headline (Centered in 980px width) -->
  <g transform="translate(155, 0)">
    <!-- Clipped Animated Headline -->
    <g clip-path="url(#typeClip)">
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="0.8">
        <tspan fill="#FFFFFF">HELLO! I'M </tspan>
        <tspan fill="url(#nameGrad)">CHIMATA RAGHURAM</tspan>
      </text>
    </g>

    <!-- Neon Typing Cursor -->
    <rect class="caret" x="0" y="20" width="4" height="38" rx="2" fill="#00E5FF" filter="url(#neonGlow)" />

    <!-- Waving Hand Emoji -->
    <text class="hand" x="644" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="34">👋</text>
  </g>

  <!-- Horizontal Cyber Subtitle Beam (Passing through central pill) -->
  <g transform="translate(0, 92)">
    <!-- Left Cyber Line and Dots (Neon Cyan) -->
    <circle cx="48" cy="14" r="2" fill="#00E5FF" opacity="0.6" />
    <circle cx="62" cy="14" r="3" fill="#00E5FF" opacity="0.8" />
    <circle cx="78" cy="14" r="4.5" fill="#00E5FF" filter="url(#neonGlow)" />
    <!-- Cyan Glowing Beam -->
    <line x1="88" y1="14" x2="236" y2="14" stroke="#00E5FF" stroke-width="2" filter="url(#neonGlow)" />
    <!-- Cyan Ring Node -->
    <circle cx="238" cy="14" r="6" fill="#070C16" stroke="#00E5FF" stroke-width="2.5" filter="url(#neonGlow)" />

    <!-- Center Subtitle Pill (Width: 480px, Height: 28px, centered at x=250 to 730) -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="480" height="28" rx="14" fill="#090E1A" stroke="url(#pillBorder)" stroke-width="1.3" />
      <text x="240" y="18.5" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast</text>
    </g>

    <!-- Right Ring Node -->
    <circle cx="742" cy="14" r="6" fill="#070C16" stroke="#A855F7" stroke-width="2.5" filter="url(#neonGlow)" />
    <!-- Purple Glowing Beam -->
    <line x1="744" y1="14" x2="892" y2="14" stroke="#A855F7" stroke-width="2" filter="url(#neonGlow)" />
    <!-- Right Cyber Dots (Purple) -->
    <circle cx="902" cy="14" r="4.5" fill="#A855F7" filter="url(#neonGlow)" />
    <circle cx="918" cy="14" r="3" fill="#A855F7" opacity="0.8" />
    <circle cx="932" cy="14" r="2" fill="#A855F7" opacity="0.6" />
  </g>
</svg>