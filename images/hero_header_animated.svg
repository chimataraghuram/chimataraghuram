<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 64" width="100%" height="auto">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="caretGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="42">
        <animate attributeName="width" values="0; 0; 475; 475; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(2px); opacity: 1; }
      50%, 90% { transform: translateX(468px); opacity: 1; }
      96%, 100% { transform: translateX(2px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(14deg); }
      80% { transform: rotate(-4deg); }
    }
    .caret {
      animation: moveCaret 6.5s infinite, blinkCaret 0.8s infinite;
    }
    .hand {
      transform-origin: 492px 26px;
      animation: waveHand 2.5s infinite ease-in-out;
    }
  </style>

  <!-- Clipped Animated Headline -->
  <g clip-path="url(#typeClip)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="26" letter-spacing="0.6">
      <tspan fill="#FFFFFF">HELLO! I'M </tspan>
      <tspan fill="url(#titleGrad)">CHIMATA RAGHURAM</tspan>
    </text>
  </g>

  <!-- Neon Typing Cursor -->
  <rect class="caret" x="0" y="10" width="3" height="26" rx="1.5" fill="#00E5FF" filter="url(#caretGlow)" />

  <!-- Waving Hand Emoji -->
  <text class="hand" x="484" y="32" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="24">👋</text>

  <!-- Sleek Subtitle -->
  <text x="1" y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="12.5" letter-spacing="0.3">
    Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast
  </text>
</svg>