<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 85" width="100%" height="auto">
  <defs>
    <!-- Clean, subtle text gradient -->
    <linearGradient id="normalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Typing clip path: width 0 to 550px -->
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="52">
        <animate attributeName="width" values="0; 0; 545; 545; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(0px); opacity: 1; }
      50%, 90% { transform: translateX(548px); opacity: 1; }
      96%, 100% { transform: translateX(0px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .caret {
      animation: moveCaret 6.5s infinite cubic-bezier(0.4, 0, 0.2, 1), blinkCaret 0.8s infinite;
    }
  </style>

  <!-- Centered / Left-aligned Animated Headline (Transparent, No Box) -->
  <g transform="translate(10, 8)">
    <g clip-path="url(#typeClip)">
      <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-weight="800" font-size="30" letter-spacing="0.5">
        <tspan fill="#F0F6FC">HELLO! I'M </tspan>
        <tspan fill="url(#normalGrad)">CHIMATA RAGHURAM</tspan>
      </text>
    </g>

    <!-- Caret Cursor -->
    <rect class="caret" y="10" width="3" height="30" rx="1.5" fill="#58A6FF" />

    <!-- Waving Hand -->
    <g transform="translate(560, 10)">
      <text y="26" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif" font-size="26">👋</text>
    </g>

    <!-- Subtitle (Clean Slate / GitHub Secondary Text) -->
    <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-weight="400" font-size="15.5" fill="#8B949E">
      Python Full-Stack Developer • Actively Learning and Tech Enthusiast
    </text>
  </g>
</svg>