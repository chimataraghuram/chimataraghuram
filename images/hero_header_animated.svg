<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 135" width="100%" height="auto">
  <defs>
    <!-- Background Gradient for Upper Wave Band (Cyan -> Teal -> Dark Blue -> Violet -> Purple) -->
    <linearGradient id="waveTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="25%" stop-color="#00A2D3" />
      <stop offset="50%" stop-color="#004D99" />
      <stop offset="75%" stop-color="#7C1FA6" />
      <stop offset="100%" stop-color="#A81FE0" />
    </linearGradient>

    <!-- Background Gradient for Lower Wave Band (Muted Teal to Violet) -->
    <linearGradient id="waveBottomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007B99" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#005B85" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#00356E" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#4B1270" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#6B138A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Vibrant Gradient Text (matching mockup) -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Pill border gradient (Cyan to Purple) -->
    <linearGradient id="pillBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Cyan Beam Gradient -->
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="1" />
    </linearGradient>

    <!-- Purple Beam Gradient -->
    <linearGradient id="purpleBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="1" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.25" />
    </linearGradient>

    <!-- Cyan Diffuse Glow Filter -->
    <filter id="cyanGlow" filterUnits="userSpaceOnUse" x="0" y="70" width="400" height="60">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Purple Diffuse Glow Filter -->
    <filter id="purpleGlow" filterUnits="userSpaceOnUse" x="650" y="70" width="330" height="60">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Wave Edge Glow -->
    <filter id="waveEdgeGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Typing clip path: width 0 to 650px (ample room for all letters) -->
    <clipPath id="typeClip">
      <rect x="0" y="10" width="0" height="56">
        <animate attributeName="width" values="0; 0; 650; 650; 0" keyTimes="0; 0.05; 0.50; 0.90; 1" dur="6.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    @keyframes moveCaret {
      0%, 5% { transform: translateX(2px); opacity: 1; }
      50%, 90% { transform: translateX(642px); opacity: 1; }
      96%, 100% { transform: translateX(2px); opacity: 0; }
    }
    @keyframes blinkCaret {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(14deg); }
      80% { transform: rotate(-4deg); }
    }
    .caret {
      animation: moveCaret 6.5s infinite, blinkCaret 0.8s infinite;
    }
    .hand {
      transform-origin: 666px 48px;
      animation: waveHand 2.5s infinite ease-in-out;
    }
  </style>

  <!-- ==================== EXACT MOCKUP WAVE BACKGROUND WITH SUBTLE ANIMATION ==================== -->
  <g id="mockupWaveTheme">
    <!-- 1. Lower Wave Layer (Smooth flowing bottom ribbon) -->
    <path fill="url(#waveBottomGrad)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.25 0 0.25 1; 0.25 0 0.25 1; 0.25 0 0.25 1"
        values="
          M-30,0 L-30,92 C90,82 170,95 340,98 C490,99 650,98 770,96 C850,86 910,88 1010,95 L1010,0 Z;
          M-30,0 L-30,82 C110,94 200,102 360,94 C490,92 630,92 780,94 C870,96 930,82 1010,88 L1010,0 Z;
          M-30,0 L-30,98 C70,78 140,88 320,104 C490,105 670,104 760,102 C830,82 890,94 1010,102 L1010,0 Z;
          M-30,0 L-30,92 C90,82 170,95 340,98 C490,99 650,98 770,96 C850,86 910,88 1010,95 L1010,0 Z"
      />
    </path>

    <!-- 2. Upper Wave Layer (Diagonal swoops from corners to center) -->
    <path fill="url(#waveTopGrad)" opacity="0.92">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.25 0 0.25 1; 0.25 0 0.25 1; 0.25 0 0.25 1"
        values="
          M-30,0 L-30,62 C60,74 120,86 180,92 C340,92 640,90 800,88 C880,78 930,64 1010,48 L1010,0 Z;
          M-30,0 L-30,50 C80,65 140,78 200,84 C370,84 620,82 820,82 C900,86 940,72 1010,56 L1010,0 Z;
          M-30,0 L-30,70 C40,80 100,94 160,100 C320,98 660,96 780,96 C860,74 910,58 1010,40 L1010,0 Z;
          M-30,0 L-30,62 C60,74 120,86 180,92 C340,92 640,90 800,88 C880,78 930,64 1010,48 L1010,0 Z"
      />
    </path>

    <!-- 3. Neon Luminous Boundary Stroke (Line 2 interior wave edge) -->
    <path fill="none" stroke="url(#waveTopGrad)" stroke-width="1.8" opacity="0.95" filter="url(#waveEdgeGlow)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.25 0 0.25 1; 0.25 0 0.25 1; 0.25 0 0.25 1"
        values="
          M-30,62 C60,74 120,86 180,92 C340,92 640,90 800,88 C880,78 930,64 1010,48;
          M-30,50 C80,65 140,78 200,84 C370,84 620,82 820,82 C900,86 940,72 1010,56;
          M-30,70 C40,80 100,94 160,100 C320,98 660,96 780,96 C860,74 910,58 1010,40;
          M-30,62 C60,74 120,86 180,92 C340,92 640,90 800,88 C880,78 930,64 1010,48"
      />
    </path>

    <!-- 4. Glowing Bottom Edge Stroke (Line 1 base wave edge) -->
    <path fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.8" filter="url(#waveEdgeGlow)">
      <animate
        attributeName="d"
        dur="7s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.333; 0.667; 1"
        keySplines="0.25 0 0.25 1; 0.25 0 0.25 1; 0.25 0 0.25 1"
        values="
          M-30,92 C90,82 170,95 340,98 C490,99 650,98 770,96 C850,86 910,88 1010,95;
          M-30,82 C110,94 200,102 360,94 C490,92 630,92 780,94 C870,96 930,82 1010,88;
          M-30,98 C70,78 140,88 320,104 C490,105 670,104 760,102 C830,82 890,94 1010,102;
          M-30,92 C90,82 170,95 340,98 C490,99 650,98 770,96 C850,86 910,88 1010,95"
      />
    </path>
  </g>

  <!-- ==================== TOP ANIMATED HEADLINE ==================== -->
  <g transform="translate(138, 0)">
    <!-- Clipped Animated Headline -->
    <g clip-path="url(#typeClip)">
      <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="0.8">
        <tspan fill="#FFFFFF">HELLO! I'M </tspan>
        <tspan fill="url(#nameGrad)">CHIMATA RAGHURAM</tspan>
      </text>
    </g>

    <!-- Neon Typing Cursor -->
    <rect class="caret" x="0" y="20" width="4" height="38" rx="2" fill="#00E5FF" />

    <!-- Waving Hand Emoji -->
    <text class="hand" x="656" y="52" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" font-size="34">👋</text>
  </g>

  <!-- ==================== HORIZONTAL CYBER SUBTITLE BEAM ==================== -->
  <g transform="translate(0, 92)">
    <!-- Left Cyber Dots (Neon Cyan) -->
    <circle cx="44" cy="15" r="2.2" fill="#00E5FF" opacity="0.6" />
    <circle cx="59" cy="15" r="3.2" fill="#00E5FF" opacity="0.85" />
    <!-- Big glowing 3rd dot from which beam radiates -->
    <circle cx="76" cy="15" r="8" fill="#00E5FF" opacity="0.3" filter="url(#cyanGlow)" />
    <circle cx="76" cy="15" r="4.6" fill="#00E5FF" />

    <!-- Left Cyan Glowing Beam (Layered for intense neon glow) -->
    <line x1="80" y1="15" x2="238" y2="15" stroke="#00E5FF" stroke-width="12" stroke-opacity="0.12" stroke-linecap="round" />
    <line x1="80" y1="15" x2="238" y2="15" stroke="#00E5FF" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" />
    <line x1="80" y1="15" x2="238" y2="15" stroke="url(#cyanBeamGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Cyan Connecting Segment into Pill -->
    <line x1="238" y1="15" x2="252" y2="15" stroke="#00E5FF" stroke-width="2" />

    <!-- Left Node Circle (Neon Cyan Outer Ring + Solid White Core) -->
    <circle cx="238" cy="15" r="12" fill="#00E5FF" opacity="0.25" filter="url(#cyanGlow)" />
    <circle cx="238" cy="15" r="6.5" fill="#070C16" stroke="#00E5FF" stroke-width="2.5" />
    <circle cx="238" cy="15" r="3.2" fill="#FFFFFF" />

    <!-- Center Subtitle Pill (x=250 to 730, perfectly centered) -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="480" height="30" rx="15" fill="#070C16" stroke="url(#pillBorder)" stroke-width="1.3" />
      <text x="240" y="19.5" text-anchor="middle" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Python Full-Stack Developer • Actively Learning &amp; Tech Enthusiast</text>
    </g>

    <!-- Right Connecting Segment from Pill -->
    <line x1="728" y1="15" x2="742" y2="15" stroke="#A855F7" stroke-width="2" />

    <!-- Right Node Circle (Neon Purple Outer Ring + Solid White Core) -->
    <circle cx="742" cy="15" r="12" fill="#A855F7" opacity="0.25" filter="url(#purpleGlow)" />
    <circle cx="742" cy="15" r="6.5" fill="#070C16" stroke="#A855F7" stroke-width="2.5" />
    <circle cx="742" cy="15" r="3.2" fill="#FFFFFF" />

    <!-- Right Purple Glowing Beam (Layered for intense neon glow) -->
    <line x1="742" y1="15" x2="900" y2="15" stroke="#A855F7" stroke-width="12" stroke-opacity="0.12" stroke-linecap="round" />
    <line x1="742" y1="15" x2="900" y2="15" stroke="#A855F7" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round" />
    <line x1="742" y1="15" x2="900" y2="15" stroke="url(#purpleBeamGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Right Cyber Dots (Purple) -->
    <circle cx="904" cy="15" r="8" fill="#A855F7" opacity="0.3" filter="url(#purpleGlow)" />
    <circle cx="904" cy="15" r="4.6" fill="#A855F7" />
    <circle cx="921" cy="15" r="3.2" fill="#A855F7" opacity="0.85" />
    <circle cx="936" cy="15" r="2.2" fill="#A855F7" opacity="0.6" />
  </g>
</svg>