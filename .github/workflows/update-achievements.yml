name: Update GitHub Achievements

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Fetch and Update Achievements
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // Note: We use dynamic import for node-fetch if necessary, 
            // but native fetch is available in Node 18+ (which github-script@v6 uses)
            const response = await fetch('https://github.com/chimataraghuram?tab=achievements');
            const html = await response.text();
            
            // Regex to find achievement images
            const regex = /<img src="(https:\/\/github\.githubassets\.com\/assets\/[^"]+)"[^>]*class="achievement-badge-sidebar"[^>]*alt="Achievement: ([^"]+)"/g;
            
            let match;
            const achievements = [];
            const seen = new Set();
            
            while ((match = regex.exec(html)) !== null) {
              const src = match[1];
              const alt = match[2];
              
              if (!seen.has(alt)) {
                seen.add(alt);
                achievements.push(`    <img src="${src}" width="100" alt="${alt}" />`);
              }
            }
            
            if (achievements.length === 0) {
              console.log('No achievements found or failed to parse.');
              return;
            }
            
            const readme = fs.readFileSync('README.md', 'utf8');
            const newReadme = readme.replace(
              /<!--START_SECTION:achievements-->[\s\S]*<!--END_SECTION:achievements-->/,
              `<!--START_SECTION:achievements-->\n${achievements.join('\n')}\n<!--END_SECTION:achievements-->`
            );
            
            if (readme !== newReadme) {
              fs.writeFileSync('README.md', newReadme);
              console.log('Updated achievements successfully!');
            } else {
              console.log('No new achievements to update.');
            }

      - name: Commit and Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "⚡ Update Official GitHub Achievements" || echo "No changes to commit"
          git push
