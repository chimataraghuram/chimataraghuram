name: Update GitHub Achievements

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-achievements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Achievements via GraphQL
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Use GitHub GraphQL API to fetch achievements (most reliable method)
            // GitHub's API doesn't directly expose achievements, so we use
            // the REST API to get user profile data and hardcode known achievement URLs
            // based on what we can verify from the public profile page.

            // Fetch the profile HTML to parse current achievements reliably
            const headers = {
              'Accept': 'text/html,application/xhtml+xml',
              'User-Agent': 'Mozilla/5.0 (compatible; GitHub-Actions-Bot)',
              'Cookie': '' // No auth cookie, public profile only
            };

            let achievements = [];

            try {
              const response = await fetch('https://github.com/chimataraghuram?tab=achievements', {
                headers
              });
              const html = await response.text();

              // Try multiple regex patterns for robustness across GitHub HTML changes
              const patterns = [
                // Pattern 1: class before src
                /class="achievement-badge[^"]*"[^>]*src="([^"]*githubassets[^"]*)"[^>]*alt="([^"]*)"/g,
                // Pattern 2: src before class
                /src="(https:\/\/github\.githubassets\.com\/[^"]+)"[^>]*class="achievement-badge[^"]*"[^>]*alt="([^"]*)"/g,
                // Pattern 3: match any githubassets achievement image
                /src="(https:\/\/github\.githubassets\.com\/(?:assets|images)\/modules\/profile\/achievements\/[^"]+\.png[^"]*)"[^>]*alt="([^"]*)"/g,
                // Pattern 4: broader match for achievement images
                /<img[^>]*?(?:achievements\/[^"]*\.png)[^>]*>/g
              ];

              const seen = new Set();

              for (const pattern of patterns.slice(0, 3)) {
                let match;
                const tempAchievements = [];
                while ((match = pattern.exec(html)) !== null) {
                  const src = match[1];
                  const alt = match[2] || 'Achievement';
                  if (!seen.has(src)) {
                    seen.add(src);
                    tempAchievements.push(`    <img src="${src}" width="100" alt="${alt}" />`);
                  }
                }
                if (tempAchievements.length > 0) {
                  achievements = tempAchievements;
                  console.log(`Found ${achievements.length} achievements using pattern.`);
                  break;
                }
              }

              if (achievements.length === 0) {
                console.log('Could not parse achievements from HTML. Keeping existing values.');
                return;
              }
            } catch (err) {
              console.log(`Error fetching achievements: ${err.message}`);
              return;
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const newReadme = readme.replace(
              /<!--START_SECTION:achievements-->[\s\S]*<!--END_SECTION:achievements-->/,
              `<!--START_SECTION:achievements-->\n${achievements.join('\n')}\n<!--END_SECTION:achievements-->`
            );

            if (readme !== newReadme) {
              fs.writeFileSync('README.md', newReadme);
              console.log('Updated achievements successfully!');
            } else {
              console.log('No new achievements to update.');
            }

      - name: Commit and Push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "⚡ Update Official GitHub Achievements" || echo "No changes to commit"
          git push
