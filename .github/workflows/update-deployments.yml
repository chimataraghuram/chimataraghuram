name: Update Deployment Count

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Update Deployment Count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          import requests
          import re

          token = os.environ.get("GITHUB_TOKEN")
          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          # Count total stars across all public repos
          user = "chimataraghuram"
          page = 1
          total_stars = 0
          total_repos = 0

          while True:
              url = f"https://api.github.com/users/{user}/repos?per_page=100&page={page}&type=public"
              resp = requests.get(url, headers=headers)
              if resp.status_code != 200:
                  print(f"Failed to fetch repos: {resp.status_code}")
                  break
              repos = resp.json()
              if not repos:
                  break
              for repo in repos:
                  total_stars += repo.get("stargazers_count", 0)
                  total_repos += 1
              page += 1

          # Count live deployments across all repos with Vercel/GitHub Pages deployments
          live_repos = [
              "chimataraghuram/PORTFOLIO",
              "chimataraghuram/PROJECT-FINDER",
              "chimataraghuram/TECHBOY-AI",
              "chimataraghuram/House-Prediction",
              "chimataraghuram/Enchanted-Wings-Marvels-of-butterfly-species",
          ]

          total_deployments = 0
          for repo in live_repos:
              url = f"https://api.github.com/repos/{repo}/deployments?per_page=1"
              resp = requests.get(url, headers=headers)
              if resp.status_code != 200:
                  print(f"Skipping {repo}: {resp.status_code}")
                  continue
              link = resp.headers.get("Link", "")
              match = re.search(r'page=(\d+)>; rel="last"', link)
              if match:
                  total_deployments += int(match.group(1))
              else:
                  total_deployments += len(resp.json())

          print(f"Total stars: {total_stars}")
          print(f"Total deployments: {total_deployments}")
          print(f"Total public repos: {total_repos}")

          # Update README.md
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          badge = f'  <img src="https://img.shields.io/badge/Deployments-{total_deployments}-22c55e?style=for-the-badge&logo=vercel" />'
          pattern = r"<!-- START_SECTION:deployments -->.*?<!-- END_SECTION:deployments -->"
          replacement = f"<!-- START_SECTION:deployments -->\n{badge}\n  <!-- END_SECTION:deployments -->"

          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)

          print("README updated successfully.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update deployment count"
            git push
          fi
