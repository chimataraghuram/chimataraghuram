name: Update Profile Stats

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Deployments Count Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_deployments.py

      - name: Fetch and Update Activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'chimataraghuram';
            let events = [];
            try {
              const response = await github.rest.activity.listPublicEventsForUser({
                username: username,
                per_page: 50
              });
              events = response.data || [];
            } catch (err) {
              console.log(`Failed to fetch events: ${err.message}`);
            }
            
            let activityRows = [];
            let seen = new Set();
            for (const ev of events) {
              if (activityRows.length >= 5) break;
              let repo = ev.repo.name;
              let url = `https://github.com/${repo}`;
              let repoShort = repo.replace(`${username}/`, '');
              let dateStr = new Date(ev.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              
              let icon = '⚡';
              let desc = '';
              let key = '';
              
              let badgeUrl = '';
              let badgeAlt = '';
              
              if (ev.type === 'PushEvent') {
                badgeUrl = 'https://img.shields.io/badge/Pushed-238636?style=flat-square&logo=git-commit&logoColor=white';
                badgeAlt = 'Pushed';
                key = `push-${repo}`;
                if (seen.has(key)) continue;
                seen.add(key);
                
                let branch = ev.payload.ref ? ev.payload.ref.replace('refs/heads/', '') : 'main';
                let commitMsg = '';
                if (ev.payload.commits && ev.payload.commits.length > 0 && ev.payload.commits[0].message) {
                  commitMsg = ev.payload.commits[0].message.split('\n')[0];
                } else if (ev.payload.head) {
                  try {
                    const [owner, rName] = repo.split('/');
                    const commitData = await github.rest.repos.getCommit({
                      owner,
                      repo: rName,
                      ref: ev.payload.head
                    });
                    commitMsg = commitData.data.commit.message.split('\n')[0];
                  } catch (e) {
                    commitMsg = `Updates to \`${branch}\``;
                  }
                } else {
                  commitMsg = `Updates to \`${branch}\``;
                }
                
                if (commitMsg.length > 55) commitMsg = commitMsg.slice(0, 52) + '...';
                desc = `<code>${commitMsg}</code>`;
              } else if (ev.type === 'IssuesEvent') {
                let action = ev.payload.action;
                badgeUrl = 'https://img.shields.io/badge/Issue-F85149?style=flat-square&logo=githubissues&logoColor=white';
                badgeAlt = 'Issue';
                let issueNum = ev.payload.issue.number;
                let title = ev.payload.issue.title || `Issue #${issueNum}`;
                if (title.length > 45) title = title.slice(0, 42) + '...';
                desc = `<b>${action.charAt(0).toUpperCase() + action.slice(1)} #${issueNum}</b> — ${title}`;
                key = `issue-${repo}-${issueNum}`;
                if (seen.has(key)) continue;
                seen.add(key);
              } else if (ev.type === 'PullRequestEvent') {
                let action = ev.payload.action;
                let isMerged = ev.payload.pull_request && ev.payload.pull_request.merged;
                if (action === 'closed' && isMerged) {
                  badgeUrl = 'https://img.shields.io/badge/PR_Merged-8957E5?style=flat-square&logo=git-pull-request&logoColor=white';
                  badgeAlt = 'PR Merged';
                  action = 'Merged';
                } else {
                  badgeUrl = 'https://img.shields.io/badge/PR-8957E5?style=flat-square&logo=git-pull-request&logoColor=white';
                  badgeAlt = 'Pull Request';
                  action = action.charAt(0).toUpperCase() + action.slice(1);
                }
                let prNum = ev.payload.number || ev.payload.pull_request.number;
                let title = ev.payload.pull_request.title || `PR #${prNum}`;
                if (title.length > 45) title = title.slice(0, 42) + '...';
                desc = `<b>${action} PR #${prNum}</b> ❯ ${title}`;
                key = `pr-${repo}-${prNum}`;
                if (seen.has(key)) continue;
                seen.add(key);
              } else if (ev.type === 'CreateEvent') {
                let refType = ev.payload.ref_type || 'repository';
                badgeUrl = 'https://img.shields.io/badge/Created-0EA5E9?style=flat-square&logo=sparkles&logoColor=white';
                badgeAlt = 'Created';
                desc = `<b>Created new ${refType}</b>`;
                key = `create-${repo}-${refType}`;
                if (seen.has(key)) continue;
                seen.add(key);
              } else if (ev.type === 'WatchEvent') {
                badgeUrl = 'https://img.shields.io/badge/Starred-E3B341?style=flat-square&logo=star&logoColor=white';
                badgeAlt = 'Starred';
                desc = `<b>Starred repository</b>`;
                key = `watch-${repo}`;
                if (seen.has(key)) continue;
                seen.add(key);
              } else if (ev.type === 'ForkEvent') {
                badgeUrl = 'https://img.shields.io/badge/Forked-58A6FF?style=flat-square&logo=git-fork&logoColor=white';
                badgeAlt = 'Forked';
                desc = `<b>Forked repository</b>`;
                key = `fork-${repo}`;
                if (seen.has(key)) continue;
                seen.add(key);
              } else {
                continue;
              }
              
              const dateBadge = `https://img.shields.io/badge/${encodeURIComponent(dateStr.replace(' ', '_'))}-161b22?style=flat-square&logo=github&logoColor=38bdf8`;
              activityRows.push(`    <tr>\n      <td align="center"><img src="${badgeUrl}" height="20" alt="${badgeAlt}" /></td>\n      <td><a href="${url}"><b><code>${repo}</code></b></a></td>\n      <td>${desc}</td>\n      <td align="center"><img src="${dateBadge}" height="20" alt="${dateStr}" /></td>\n    </tr>`);
            }
            
            let tableContent = '';
            if (activityRows.length === 0) {
              tableContent = '<p align="center"><i>No recent activity found.</i></p>';
            } else {
              tableContent = `<table width="100%">\n  <thead>\n    <tr>\n      <th width="15%" align="center">Event</th>\n      <th width="32%" align="left">Repository</th>\n      <th width="39%" align="left">Contribution</th>\n      <th width="14%" align="center">Date</th>\n    </tr>\n  </thead>\n  <tbody>\n${activityRows.join('\n')}\n    <tr>\n      <td colspan="4" height="1" style="padding:0; margin:0; border:none; line-height:1px; background:transparent;"><img src="https://raw.githubusercontent.com/chimataraghuram/chimataraghuram/main/images/transparent_spacer.png" width="900" height="1" style="display:block; border:none; opacity:0; height:1px;" alt="" /></td>\n    </tr>\n  </tbody>\n</table>`;
            }
            
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!--START_SECTION:activity-->[\s\S]*<!--END_SECTION:activity-->/,
              `<!--START_SECTION:activity-->\n${tableContent}\n<!--END_SECTION:activity-->`
            );
            
            // Update Profile Stats Section automatically
            let followers = 14;
            let publicRepos = 24;
            let totalStars = 14;
            try {
              const { data: userResp } = await github.rest.users.getByUsername({ username: 'chimataraghuram' });
              if (userResp) {
                followers = userResp.followers || followers;
                publicRepos = userResp.public_repos || publicRepos;
              }
              const { data: reposData } = await github.rest.repos.listForUser({ username: 'chimataraghuram', per_page: 100 });
              if (reposData) {
                totalStars = reposData.reduce((acc, r) => acc + (r.stargazers_count || 0), 0);
              }
            } catch (err) {
              console.log(`Failed to fetch user stats: ${err.message}`);
            }

            // Extract or update Profile Views count safely
            let viewsCount = '2,012';
            const viewsMatch = readme.match(/Profile_Views-([0-9,%2C+]+)-/);
            if (viewsMatch) {
              viewsCount = decodeURIComponent(viewsMatch[1]);
            }
            try {
              const resp = await fetch('https://komarev.com/ghpvc/?username=chimataraghuram&style=for-the-badge&color=7c3aed');
              if (resp.ok) {
                const text = await resp.text();
                const m = text.match(/<text[^>]*>([0-9,]+)<\/text>/i);
                if (m) viewsCount = m[1];
              }
            } catch (err) {
              console.log('Failed to fetch from komarev, keeping previous count:', err.message);
            }
            const cleanViews = encodeURIComponent(viewsCount);

            // Extract existing deployments count or keep current
            const depMatch = readme.match(/Deployments-(\d+)-/);
            const deploymentsCount = depMatch ? depMatch[1] : '1763';

            const starLogo = 'data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI%2BPHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMiAxNy4yN0wxOC4xOCAyMWwtMS42NC03LjAzTDIyIDkuMjRsLTcuMTktLjYxTDEyIDIgOS4xOSA4LjYzIDIgOS4yNGw1LjQ2IDQuNzNMNS44MiAyMXoiLz48L3N2Zz4%3D';
            const statsBlock = `<!-- START_SECTION:profile_stats -->\n<p align="center">\n  <img src="https://img.shields.io/badge/Profile_Views-${cleanViews}-7c3aed?style=for-the-badge&logo=eye&logoColor=white" alt="Profile Views" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Followers-${followers}-c026d3?style=for-the-badge&logo=github&logoColor=white" alt="Followers" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Stars-${totalStars}-0ea5e9?style=for-the-badge&logo=${starLogo}" alt="Stars" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Deployments-${deploymentsCount}-22c55e?style=for-the-badge&logo=vercel&logoColor=white" alt="Deployments" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Repositories-${publicRepos}-a855f7?style=for-the-badge&logo=git&logoColor=white" alt="Repositories" />\n  &nbsp;\n  <a href="https://leetcode.com/u/chimataraghuram/"><img src="https://img.shields.io/badge/LeetCode-Profile-FFA116?style=for-the-badge&logo=leetcode&logoColor=white" alt="LeetCode Profile" /></a>\n</p>\n<!-- END_SECTION:profile_stats -->`;

            readme = readme.replace(
              /<!-- START_SECTION:profile_stats -->[\s\S]*<!-- END_SECTION:profile_stats -->/,
              statsBlock
            );

            const currentDate = new Date().toISOString().split('T')[0];
            readme = readme.replace(
              /github-contribution-grid-snake-dark\.svg(\?v=[a-zA-Z0-9-]+)?/g,
              `github-contribution-grid-snake-dark.svg?v=${currentDate}`
            );
            readme = readme.replace(
              /github-contribution-grid-snake\.svg(\?v=[a-zA-Z0-9-]+)?/g,
              `github-contribution-grid-snake.svg?v=${currentDate}`
            );
            
            fs.writeFileSync('README.md', readme);

      - name: Fetch and Update Achievements
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Fetch the profile HTML to parse current achievements reliably
            const headers = {
              'Accept': 'text/html,application/xhtml+xml',
              'User-Agent': 'Mozilla/5.0 (compatible; GitHub-Actions-Bot)'
            };

            let achievements = [];

            try {
              const response = await fetch('https://github.com/chimataraghuram?tab=achievements', { headers });
              const html = await response.text();

              // Try multiple regex patterns for robustness across GitHub HTML changes
              const patterns = [
                /class="achievement-badge[^"]*"[^>]*src="([^"]*githubassets[^"]*)"[^>]*alt="([^"]*)"/g,
                /src="(https:\/\/github\.githubassets\.com\/[^"]+)"[^>]*class="achievement-badge[^"]*"[^>]*alt="([^"]*)"/g,
                /src="(https:\/\/github\.githubassets\.com\/(?:assets|images)\/modules\/profile\/achievements\/[^"]+\.png[^"]*)"[^>]*alt="([^"]*)"/g
              ];

              const seen = new Set();

              for (const pattern of patterns) {
                let match;
                const tempAchievements = [];
                while ((match = pattern.exec(html)) !== null) {
                  const src = match[1];
                  const alt = match[2] || 'Achievement';
                  if (!seen.has(src)) {
                    seen.add(src);
                    let slug = 'achievements';
                    const lowerAlt = alt.toLowerCase();
                    const lowerSrc = src.toLowerCase();
                    if (lowerAlt.includes('pull shark') || lowerSrc.includes('pull-shark')) slug = 'pull-shark';
                    else if (lowerAlt.includes('yolo') || lowerSrc.includes('yolo')) slug = 'yolo';
                    else if (lowerAlt.includes('quickdraw') || lowerSrc.includes('quickdraw')) slug = 'quickdraw';
                    else if (lowerAlt.includes('pair extra') || lowerSrc.includes('pair-extraordinaire')) slug = 'pair-extraordinaire';
                    else if (lowerAlt.includes('galaxy brain') || lowerSrc.includes('galaxy-brain')) slug = 'galaxy-brain';
                    else if (lowerAlt.includes('starstruck') || lowerSrc.includes('starstruck')) slug = 'starstruck';
                    else if (lowerAlt.includes('heart on sleeve') || lowerSrc.includes('heart-on-your-sleeve')) slug = 'heart-on-your-sleeve';
                    else slug = lowerAlt.replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

                    let displayName = alt.replace(/^Achievement:\s*/i, '').trim();
                    let extraTier = '';
                    if (lowerAlt.includes('pull shark') || lowerSrc.includes('pull-shark')) extraTier = ' <small>(x2)</small>';
                    tempAchievements.push({ src, alt, slug, displayName, extraTier });
                  }
                }
                if (tempAchievements.length > 0) {
                  achievements = tempAchievements;
                  console.log(`Found ${achievements.length} achievements using pattern.`);
                  break;
                }
              }

              if (achievements.length === 0) {
                console.log('Could not parse achievements from HTML. Keeping existing values.');
                return;
              }
            } catch (err) {
              console.log(`Error fetching achievements: ${err.message}`);
              return;
            }

            const badgeRow = achievements.map(a => {
              let imgSrc = a.src;
              if (a.slug === 'pull-shark') {
                imgSrc = 'https://raw.githubusercontent.com/chimataraghuram/chimataraghuram/main/images/pull-shark-bronze-x2.png';
              }
              return `  <a href="https://github.com/chimataraghuram?achievement=${a.slug}&tab=achievements"><img src="${imgSrc}" width="105" alt="${a.displayName}" /></a>`;
            }).join('\n  &nbsp;&nbsp;&nbsp;&nbsp;\n');

            const labelRow = achievements.map(a => {
              const safeSlug = a.slug.replace(/-/g, '_');
              const labelUrl = `https://raw.githubusercontent.com/chimataraghuram/chimataraghuram/main/images/badge_label_${safeSlug}.svg`;
              return `  <a href="https://github.com/chimataraghuram?achievement=${a.slug}&tab=achievements"><img src="${labelUrl}" width="105" alt="${a.displayName}" /></a>`;
            }).join('\n  &nbsp;&nbsp;&nbsp;&nbsp;\n');

            const achievementsBlock = `<!--START_SECTION:achievements-->\n${badgeRow}\n  <br/>\n${labelRow}\n<!--END_SECTION:achievements-->`;

            const readme = fs.readFileSync('README.md', 'utf8');
            const newReadme = readme.replace(
              /<!--START_SECTION:achievements-->[\s\S]*<!--END_SECTION:achievements-->/,
              achievementsBlock
            );

            if (readme !== newReadme) {
              fs.writeFileSync('README.md', newReadme);
              console.log('Updated achievements successfully!');
            } else {
              console.log('No new achievements to update.');
            }

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update profile stats"
          branch: main
          file_pattern: "README.md"
