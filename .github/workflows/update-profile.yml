name: Update Profile Stats

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: update-profile-stats
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run Deployments Count Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_deployments.py

      - name: Fetch and Update Activity
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'chimataraghuram';
            let events = [];
            try {
              const response = await github.rest.activity.listPublicEventsForUser({
                username: username,
                per_page: 30
              });
              events = response.data || [];
            } catch (err) {
              console.log(`Failed to fetch events: ${err.message}`);
            }
            
            let activity = [];
            for (const ev of events) {
              if (activity.length >= 5) break;
              let repo = ev.repo.name;
              let url = `https://github.com/${repo}`;
              
              let dateStr = new Date(ev.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              
              if (ev.type === 'PushEvent') {
                let commits = ev.payload.size || (ev.payload.commits ? ev.payload.commits.length : 1);
                let branch = ev.payload.ref ? ev.payload.ref.replace('refs/heads/', '') : 'main';
                let commitMsg = ev.payload.commits && ev.payload.commits.length > 0 ? (ev.payload.commits[0].message || 'Updates pushed').split('\n')[0] : 'Updates pushed';
                activity.push(`- 🚀 Pushed ${commits} commit(s) to \`${branch}\` in **[${repo}](${url})** — _${commitMsg}_ \`(${dateStr})\``);
              } else if (ev.type === 'IssuesEvent') {
                let action = ev.payload.action;
                let issueNum = ev.payload.issue.number;
                let issueUrl = ev.payload.issue.html_url || `https://github.com/${repo}/issues/${issueNum}`;
                let title = ev.payload.issue.title || `Issue #${issueNum}`;
                let emoji = action === 'opened' ? '❗' : (action === 'closed' ? '🔒' : '🗣️');
                activity.push(`- ${emoji} ${action.charAt(0).toUpperCase() + action.slice(1)} Issue [#${issueNum}](${issueUrl}) in **[${repo}](${url})** — _${title}_ \`(${dateStr})\``);
              } else if (ev.type === 'PullRequestEvent') {
                let action = ev.payload.action;
                let prNum = ev.payload.number || ev.payload.pull_request.number;
                let prUrl = ev.payload.pull_request.html_url || `https://github.com/${repo}/pull/${prNum}`;
                let title = ev.payload.pull_request.title || `Pull Request #${prNum}`;
                activity.push(`- 🔄 ${action.charAt(0).toUpperCase() + action.slice(1)} PR [#${prNum}](${prUrl}) in **[${repo}](${url})** — _${title}_ \`(${dateStr})\``);
              } else if (ev.type === 'CreateEvent') {
                let refType = ev.payload.ref_type;
                activity.push(`- 🎉 Created ${refType} in **[${repo}](${url})** \`(${dateStr})\``);
              } else if (ev.type === 'WatchEvent') {
                activity.push(`- ⭐ Starred **[${repo}](${url})** \`(${dateStr})\``);
              } else if (ev.type === 'ForkEvent') {
                activity.push(`- 🍴 Forked **[${repo}](${url})** \`(${dateStr})\``);
              } else {
                continue;
              }
            }
            
            if (activity.length === 0) activity.push("No recent activity found.");
            
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!--START_SECTION:activity-->[\s\S]*<!--END_SECTION:activity-->/,
              `<!--START_SECTION:activity-->\n${activity.join('\n')}\n<!--END_SECTION:activity-->`
            );
            
            // Update Profile Stats Section automatically
            let followers = 14;
            let publicRepos = 24;
            let totalStars = 14;
            try {
              const { data: userResp } = await github.rest.users.getByUsername({ username: 'chimataraghuram' });
              if (userResp) {
                followers = userResp.followers || followers;
                publicRepos = userResp.public_repos || publicRepos;
              }
              const { data: reposData } = await github.rest.repos.listForUser({ username: 'chimataraghuram', per_page: 100 });
              if (reposData) {
                totalStars = reposData.reduce((acc, r) => acc + (r.stargazers_count || 0), 0);
              }
            } catch (err) {
              console.log(`Failed to fetch user stats: ${err.message}`);
            }

            // Extract existing deployments count or keep current
            const depMatch = readme.match(/Deployments-(\d+)-/);
            const deploymentsCount = depMatch ? depMatch[1] : '1763';

            const starLogo = 'data%3Aimage%2Fsvg%2Bxml%3Bbase64%2CPHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCI%2BPHBhdGggZmlsbD0id2hpdGUiIGQ9Ik0xMiAxNy4yN0wxOC4xOCAyMWwtMS42NC03LjAzTDIyIDkuMjRsLTcuMTktLjYxTDEyIDIgOS4xOSA4LjYzIDIgOS4yNGw1LjQ2IDQuNzNMNS44MiAyMXoiLz48L3N2Zz4%3D';
            const statsBlock = `<!-- START_SECTION:profile_stats -->\n<p align="center">\n  <img src="https://komarev.com/ghpvc/?username=chimataraghuram&label=Profile+Views&color=7c3aed&style=for-the-badge" alt="Profile Views" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Followers-${followers}-c026d3?style=for-the-badge&logo=github&logoColor=white" alt="Followers" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Stars-${totalStars}-0ea5e9?style=for-the-badge&logo=${starLogo}" alt="Stars" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Deployments-${deploymentsCount}-22c55e?style=for-the-badge&logo=vercel&logoColor=white" alt="Deployments" />\n  &nbsp;\n  <img src="https://img.shields.io/badge/Repositories-${publicRepos}-a855f7?style=for-the-badge&logo=git&logoColor=white" alt="Repositories" />\n  &nbsp;\n  <a href="https://leetcode.com/u/chimataraghuram/"><img src="https://img.shields.io/badge/LeetCode-Profile-FFA116?style=for-the-badge&logo=leetcode&logoColor=white" alt="LeetCode Profile" /></a>\n</p>\n<!-- END_SECTION:profile_stats -->`;

            readme = readme.replace(
              /<!-- START_SECTION:profile_stats -->[\s\S]*<!-- END_SECTION:profile_stats -->/,
              statsBlock
            );

            const currentDate = new Date().toISOString().split('T')[0];
            readme = readme.replace(
              /github-contribution-grid-snake-dark\.svg(\?v=[a-zA-Z0-9-]+)?/g,
              `github-contribution-grid-snake-dark.svg?v=${currentDate}`
            );
            readme = readme.replace(
              /github-contribution-grid-snake\.svg(\?v=[a-zA-Z0-9-]+)?/g,
              `github-contribution-grid-snake.svg?v=${currentDate}`
            );
            
            fs.writeFileSync('README.md', readme);

      - name: Fetch and Update Achievements
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Fetch the profile HTML to parse current achievements reliably
            const headers = {
              'Accept': 'text/html,application/xhtml+xml',
              'User-Agent': 'Mozilla/5.0 (compatible; GitHub-Actions-Bot)'
            };

            let achievements = [];

            try {
              const response = await fetch('https://github.com/chimataraghuram?tab=achievements', { headers });
              const html = await response.text();

              // Try multiple regex patterns for robustness across GitHub HTML changes
              const patterns = [
                /class="achievement-badge[^"]*"[^>]*src="([^"]*githubassets[^"]*)"[^>]*alt="([^"]*)"/g,
                /src="(https:\/\/github\.githubassets\.com\/[^"]+)"[^>]*class="achievement-badge[^"]*"[^>]*alt="([^"]*)"/g,
                /src="(https:\/\/github\.githubassets\.com\/(?:assets|images)\/modules\/profile\/achievements\/[^"]+\.png[^"]*)"[^>]*alt="([^"]*)"/g
              ];

              const seen = new Set();

              for (const pattern of patterns) {
                let match;
                const tempAchievements = [];
                while ((match = pattern.exec(html)) !== null) {
                  const src = match[1];
                  const alt = match[2] || 'Achievement';
                  if (!seen.has(src)) {
                    seen.add(src);
                    tempAchievements.push(`    <img src="${src}" width="100" alt="${alt}" />`);
                  }
                }
                if (tempAchievements.length > 0) {
                  achievements = tempAchievements;
                  console.log(`Found ${achievements.length} achievements using pattern.`);
                  break;
                }
              }

              if (achievements.length === 0) {
                console.log('Could not parse achievements from HTML. Keeping existing values.');
                return;
              }
            } catch (err) {
              console.log(`Error fetching achievements: ${err.message}`);
              return;
            }

            const readme = fs.readFileSync('README.md', 'utf8');
            const newReadme = readme.replace(
              /<!--START_SECTION:achievements-->[\s\S]*<!--END_SECTION:achievements-->/,
              `<!--START_SECTION:achievements-->\n${achievements.join('\n')}\n<!--END_SECTION:achievements-->`
            );

            if (readme !== newReadme) {
              fs.writeFileSync('README.md', newReadme);
              console.log('Updated achievements successfully!');
            } else {
              console.log('No new achievements to update.');
            }

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update profile stats"
          branch: main
          file_pattern: "README.md"
