name: Update Repositories Count

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run repositories count script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # To include private repositories in the count, add a PAT secret in your repository settings
          # and uncomment the line below.
          # PAT: ${{ secrets.PAT }}
        run: python3 .github/scripts/update_repositories.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update repository count dynamically"
            git pull --rebase origin main
            git push origin main
          fi
