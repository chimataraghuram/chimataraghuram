name: Pokémon Contribution Battle

on:
  schedule:
    - cron: '0 1 * * *'   # Daily at 01:00 UTC (after GitHub updates contribution data)
  workflow_dispatch:        # Allow manual runs
  push:
    branches:
      - main
    paths:
      - "generate_pokemon_contribution.py"
      - ".github/workflows/pokemon_contribution.yml"

permissions:
  contents: write

concurrency:
  group: pokemon-contribution-battle
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Pokémon Contribution Battle SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: chimataraghuram
          OUTPUT_FILE: images/pokemon_contribution_battle.svg
        run: |
          python generate_pokemon_contribution.py

      - name: Commit and push changes directly to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update pokemon contribution battle [skip ci]"
          branch: main
          file_pattern: "images/pokemon_contribution_battle.svg"
